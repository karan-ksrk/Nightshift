org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler (Build Tools API backend) fails to close its
# memory-mapped .tab cache files on this machine -- "Could not close
# incremental caches", reproducible even after a clean build. Known Windows
# issue (real-time antivirus scanning locking the mmap'd files during
# close). Disabling incremental compilation avoids the cache entirely;
# builds are a bit slower but actually complete.
kotlin.incremental=false
